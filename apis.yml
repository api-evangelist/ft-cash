aid: ft-cash
name: FT Cash
description: >-
  FTCash (ftcash) is a Mumbai, India based financial services / fintech company
  focused on financial inclusion for micro-merchants and small and medium
  enterprises (SMEs). It provides digital payment acceptance and working-capital
  business loans to small offline retailers and merchants who are typically
  underserved by traditional banking, enabling them to accept digital payments
  and access short-term credit. FTCash was surfaced as a portfolio company of
  500 Global (500 Startups) and added to the API Evangelist network. At this
  time FTCash operates a public marketing website but publishes no public
  developer program, API documentation, or machine-readable API artifacts, so
  this profile is limited to verified company identity plus a live
  domain-security probe.
